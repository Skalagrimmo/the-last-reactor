name: Screenshots

# The PNG files in docs/screenshots/ are deterministic output of the game's
# own capture harness (fixed seed, fixed frame). Binary files cannot be
# written through the publishing connector used to maintain this repo, so
# the workflow regenerates them from source whenever code or tests change.

on:
  push:
    paths:
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate screenshots
        run: node tests/regen-screenshots.js

      - name: Commit screenshots (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "screenshots: regenerate from source (workflow)"
            git push
          fi
